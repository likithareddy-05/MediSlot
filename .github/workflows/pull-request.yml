name: Pull Request Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -d .github/workflows
          test -d infrastructure
          test -f README.md
          test -f .gitignore

      - name: Check infrastructure templates are present
        run: |
          find infrastructure -maxdepth 1 -type f -name '*.yaml' -print
