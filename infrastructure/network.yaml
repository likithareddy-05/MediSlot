
AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot network foundation with VPC endpoints for private AWS service connectivity

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR range for the MediSlot VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR range for the public subnet

  PrivateSubnetACidr:
    Type: String
    Default: 10.0.11.0/24
    Description: CIDR range for private subnet A

  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.12.0/24
    Description: CIDR range for private subnet B

Resources:
  # --------------------------------------------------
  # VPC
  # --------------------------------------------------

  MediSlotVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-vpc'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-igw'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MediSlotVPC
      InternetGatewayId: !Ref InternetGateway

  # --------------------------------------------------
  # Subnets
  # --------------------------------------------------

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-public-subnet'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-private-subnet-a'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-private-subnet-b'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  # --------------------------------------------------
  # Route tables
  # --------------------------------------------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-public-rt'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-private-rt'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # --------------------------------------------------
  # Application security groups
  # --------------------------------------------------

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the MediSlot Flask EC2 application
      VpcId: !Ref MediSlotVPC
      SecurityGroupIngress:
        - Description: HTTP access
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTPS access
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-ec2-sg'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for MediSlot backend Lambda functions
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-lambda-sg'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL only from the MediSlot Lambda security group
      VpcId: !Ref MediSlotVPC
      SecurityGroupIngress:
        - Description: MySQL from backend Lambda functions
          IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-rds-sg'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  # --------------------------------------------------
  # VPC endpoint security group
  # Allow HTTPS from backend Lambda functions only
  # --------------------------------------------------

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from MediSlot Lambda functions to interface endpoints
      VpcId: !Ref MediSlotVPC
      SecurityGroupIngress:
        - Description: HTTPS from backend Lambda security group
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-vpc-endpoints-sg'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  # --------------------------------------------------
  # S3 Gateway endpoint
  # No hourly endpoint charge
  # --------------------------------------------------

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRouteTable
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-s3-endpoint'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  # --------------------------------------------------
  # SSM Parameter Store interface endpoint
  # --------------------------------------------------

  SSMInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-ssm-endpoint'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  # --------------------------------------------------
  # SNS interface endpoint
  # --------------------------------------------------

  SNSInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sns'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-sns-endpoint'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  # --------------------------------------------------
  # EventBridge interface endpoint
  # --------------------------------------------------

  EventBridgeInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.events'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-events-endpoint'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

  # --------------------------------------------------
  # CloudWatch Logs interface endpoint
  # --------------------------------------------------

  CloudWatchLogsInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${EnvironmentName}-logs-endpoint'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: MediSlot

# --------------------------------------------------
# Outputs
# --------------------------------------------------

Outputs:
  VpcId:
    Description: MediSlot VPC ID
    Value: !Ref MediSlotVPC
    Export:
      Name: !Sub 'medislot-${EnvironmentName}-VpcId'

  PublicSubnetId:
    Description: Public subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub 'medislot-${EnvironmentName}-PublicSubnetId'

  PrivateSubnetAId:
    Description: Private subnet A ID
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub 'medislot-${EnvironmentName}-PrivateSubnetAId'

  PrivateSubnetBId:
    Description: Private subnet B ID
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub 'medislot-${EnvironmentName}-PrivateSubnetBId'

  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable

  PrivateRouteTableId:
    Description: Private route table ID shared by both private subnets
    Value: !Ref PrivateRouteTable

  EC2SecurityGroupId:
    Description: EC2 security group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub 'medislot-${EnvironmentName}-EC2SecurityGroupId'

  LambdaSecurityGroupId:
    Description: Lambda security group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub 'medislot-${EnvironmentName}-LambdaSecurityGroupId'

  RDSSecurityGroupId:
    Description: RDS security group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub 'medislot-${EnvironmentName}-RDSSecurityGroupId'

  VPCEndpointSecurityGroupId:
    Description: Security group used by interface endpoints
    Value: !Ref VPCEndpointSecurityGroup
    Export:
      Name: !Sub 'medislot-${EnvironmentName}-VPCEndpointSecurityGroupId'

  S3GatewayEndpointId:
    Description: S3 gateway endpoint ID
    Value: !Ref S3GatewayEndpoint

  SSMInterfaceEndpointId:
    Description: SSM Parameter Store interface endpoint ID
    Value: !Ref SSMInterfaceEndpoint

  SNSInterfaceEndpointId:
    Description: SNS interface endpoint ID
    Value: !Ref SNSInterfaceEndpoint

  EventBridgeInterfaceEndpointId:
    Description: EventBridge interface endpoint ID
    Value: !Ref EventBridgeInterfaceEndpoint

  CloudWatchLogsInterfaceEndpointId:
    Description: CloudWatch Logs interface endpoint ID
    Value: !Ref CloudWatchLogsInterfaceEndpoint
