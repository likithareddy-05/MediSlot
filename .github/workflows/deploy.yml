name: MediSlot Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: medislot-infrastructure-${{ vars.ENVIRONMENT_NAME }}
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Deploy MediSlot
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature'
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
      ARTIFACT_BUCKET: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration and files
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION ENVIRONMENT_NAME; do
            if [[ -z "${!name:-}" || "${!name}" == "null" ]]; then
              echo "::error::Missing GitHub repository variable: ${name}"
              exit 1
            fi
          done
          case "$ENVIRONMENT_NAME" in dev|test|prod) ;; *) echo "::error::ENVIRONMENT_NAME must be dev, test, or prod"; exit 1 ;; esac
          [[ "$AWS_REGION" == "ap-south-1" ]] || { echo "::error::Set AWS_REGION repository variable to ap-south-1 for this MediSlot deployment."; exit 1; }
          test -n "${{ secrets.AWS_ROLE_ARN }}" || { echo '::error::Missing AWS_ROLE_ARN secret'; exit 1; }
          for file in \
            infrastructure/network.yaml infrastructure/data.yaml infrastructure/security.yaml \
            infrastructure/authentication.yaml infrastructure/schema-init.yaml infrastructure/dashboard.yaml \
            src/lambdas/auth_handler.py src/lambdas/register.py src/lambdas/refresh.py \
            src/lambdas/logout.py src/lambdas/authorizer.py src/lambdas/profile.py \
            src/lambdas/schema_init.py src/lambdas/doctor_domain.py \
            src/lambdas/slot_materializer.py src/lambdas/slot_time.py \
            src/lambdas/requirements.txt database/schema.sql \
            dashboard/app.py dashboard/doctor_dashboard.html dashboard/requirements.txt \
            tests/test_dst_materializer.py tests/test_slot_idempotency.py; do
            test -f "$file" || { echo "::error::Missing required file: $file"; exit 1; }
          done

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --region "$AWS_REGION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r src/lambdas/requirements.txt
          python -m compileall -q src/lambdas dashboard
          python -m unittest discover -s tests -v

      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail
          for template in infrastructure/network.yaml infrastructure/data.yaml infrastructure/security.yaml infrastructure/authentication.yaml infrastructure/schema-init.yaml infrastructure/dashboard.yaml; do
            echo "Validating $template"
            aws cloudformation validate-template --template-body "file://${template}" --region "$AWS_REGION" >/dev/null
          done

      - name: Deploy network, data and security stacks
        shell: bash
        run: |
          set -euo pipefail
          deploy_stack() {
            local stack="$1" template="$2"; shift 2
            aws cloudformation deploy --stack-name "$stack" --template-file "$template" \
              --parameter-overrides "EnvironmentName=${ENVIRONMENT_NAME}" "$@" \
              --capabilities CAPABILITY_NAMED_IAM --region "$AWS_REGION" --no-fail-on-empty-changeset
          }
          deploy_stack "medislot-${ENVIRONMENT_NAME}-network" infrastructure/network.yaml
          deploy_stack "medislot-${ENVIRONMENT_NAME}-data" infrastructure/data.yaml
          deploy_stack "medislot-${ENVIRONMENT_NAME}-security" infrastructure/security.yaml

      - name: Resolve deployment artifact bucket
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks --stack-name "medislot-${ENVIRONMENT_NAME}-data" \
            --query "Stacks[0].Outputs[?OutputKey=='AssetsBucketName'].OutputValue | [0]" \
            --output text --region "$AWS_REGION")"
          [[ -n "$bucket" && "$bucket" != "None" ]] || { echo '::error::AssetsBucketName output missing'; exit 1; }
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Package and upload Lambda artifacts
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/lambdas
          package_lambda() {
            local name="$1"; shift
            local dir="build/${name}" zipfile="build/lambdas/${name}.zip" key="artifacts/${GITHUB_SHA}/${name}.zip"
            rm -rf "$dir"; mkdir -p "$dir"
            python -m pip install --only-binary=:all: -r src/lambdas/requirements.txt -t "$dir"
            for source in "$@"; do cp "src/lambdas/$source" "$dir/"; done
            (cd "$dir" && zip -qr "../lambdas/${name}.zip" .)
            aws s3 cp "$zipfile" "s3://${ARTIFACT_BUCKET}/${key}" --region "$AWS_REGION"
          }
          package_lambda auth auth_handler.py register.py refresh.py logout.py
          package_lambda authorizer authorizer.py
          package_lambda profile profile.py
          package_lambda doctor-domain doctor_domain.py
          package_lambda slot-materializer slot_materializer.py slot_time.py

          schema_dir=build/schema-init
          rm -rf "$schema_dir"; mkdir -p "$schema_dir"
          python -m pip install --only-binary=:all: PyMySQL -t "$schema_dir"
          cp src/lambdas/schema_init.py database/schema.sql "$schema_dir/"
          (cd "$schema_dir" && zip -qr ../lambdas/schema-init.zip .)
          aws s3 cp build/lambdas/schema-init.zip "s3://${ARTIFACT_BUCKET}/artifacts/${GITHUB_SHA}/schema-init.zip" --region "$AWS_REGION"

      - name: Deploy authentication and doctor API
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "medislot-${ENVIRONMENT_NAME}-authentication" \
            --template-file infrastructure/authentication.yaml \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "LambdaArtifactBucket=${ARTIFACT_BUCKET}" \
              "AuthLambdaS3Key=artifacts/${GITHUB_SHA}/auth.zip" \
              "AuthorizerLambdaS3Key=artifacts/${GITHUB_SHA}/authorizer.zip" \
              "ProfileLambdaS3Key=artifacts/${GITHUB_SHA}/profile.zip" \
              "DoctorDomainLambdaS3Key=artifacts/${GITHUB_SHA}/doctor-domain.zip" \
              "SlotMaterializerLambdaS3Key=artifacts/${GITHUB_SHA}/slot-materializer.zip" \
              "DashboardOrigin=127.0.0.1" \
            --capabilities CAPABILITY_NAMED_IAM --region "$AWS_REGION" --no-fail-on-empty-changeset

      - name: Deploy and explicitly invoke schema initializer
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "medislot-${ENVIRONMENT_NAME}-schema-init" \
            --template-file infrastructure/schema-init.yaml \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "LambdaArtifactBucket=${ARTIFACT_BUCKET}" \
              "SchemaInitLambdaS3Key=artifacts/${GITHUB_SHA}/schema-init.zip" \
            --region "$AWS_REGION" --no-fail-on-empty-changeset

          aws lambda invoke --function-name "medislot-${ENVIRONMENT_NAME}-schema-init" \
            --payload '{"confirm":"INITIALIZE_MEDISLOT_SCHEMA"}' \
            --cli-binary-format raw-in-base64-out --region "$AWS_REGION" \
            /tmp/schema-init-response.json > /tmp/schema-init-metadata.json
          cat /tmp/schema-init-metadata.json
          cat /tmp/schema-init-response.json
          jq -e '(.FunctionError // null) == null' /tmp/schema-init-metadata.json >/dev/null
          jq -e '.statusCode == 200' /tmp/schema-init-response.json >/dev/null

      - name: Materialize initial rolling slot window
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "medislot-${ENVIRONMENT_NAME}-slot-materializer" \
            --payload '{}' --cli-binary-format raw-in-base64-out --region "$AWS_REGION" \
            /tmp/slot-materializer-response.json > /tmp/slot-materializer-metadata.json
          cat /tmp/slot-materializer-metadata.json
          cat /tmp/slot-materializer-response.json
          jq -e '(.FunctionError // null) == null' /tmp/slot-materializer-metadata.json >/dev/null
          jq -e '.statusCode == 200' /tmp/slot-materializer-response.json >/dev/null

      - name: Package and upload dashboard
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dashboard/dashboard
          cp dashboard/app.py dashboard/doctor_dashboard.html dashboard/requirements.txt build/dashboard/dashboard/
          (cd build/dashboard && zip -qr ../dashboard.zip dashboard)
          aws s3 cp build/dashboard.zip "s3://${ARTIFACT_BUCKET}/artifacts/${GITHUB_SHA}/dashboard.zip" --region "$AWS_REGION"

      - name: Resolve API Gateway base URL
        id: api
        shell: bash
        run: |
          set -euo pipefail
          url="$(aws cloudformation describe-stacks --stack-name "medislot-${ENVIRONMENT_NAME}-authentication" \
            --query "Stacks[0].Outputs[?OutputKey=='RestApiBaseUrl'].OutputValue | [0]" \
            --output text --region "$AWS_REGION")"
          [[ "$url" == https://* ]] || { echo '::error::RestApiBaseUrl output missing or invalid'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy HTTPS dashboard
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
          API_BASE_URL: ${{ steps.api.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "medislot-${ENVIRONMENT_NAME}-dashboard" \
            --template-file infrastructure/dashboard.yaml \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "DashboardArtifactBucket=${ARTIFACT_BUCKET}" \
              "DashboardArtifactS3Key=artifacts/${GITHUB_SHA}/dashboard.zip" \
              "ApiBaseUrl=${API_BASE_URL}" \
            --capabilities CAPABILITY_NAMED_IAM --region "$AWS_REGION" --no-fail-on-empty-changeset

      - name: Connect dashboard HTTPS route through the same REST API
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail
          dashboard_origin="$(aws cloudformation describe-stacks --stack-name "medislot-${ENVIRONMENT_NAME}-dashboard" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardPublicDns'].OutputValue | [0]" \
            --output text --region "$AWS_REGION")"
          [[ -n "$dashboard_origin" && "$dashboard_origin" != "None" ]] || { echo '::error::DashboardPublicDns output missing'; exit 1; }
          aws cloudformation deploy --stack-name "medislot-${ENVIRONMENT_NAME}-authentication" \
            --template-file infrastructure/authentication.yaml \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "LambdaArtifactBucket=${ARTIFACT_BUCKET}" \
              "AuthLambdaS3Key=artifacts/${GITHUB_SHA}/auth.zip" \
              "AuthorizerLambdaS3Key=artifacts/${GITHUB_SHA}/authorizer.zip" \
              "ProfileLambdaS3Key=artifacts/${GITHUB_SHA}/profile.zip" \
              "DoctorDomainLambdaS3Key=artifacts/${GITHUB_SHA}/doctor-domain.zip" \
              "SlotMaterializerLambdaS3Key=artifacts/${GITHUB_SHA}/slot-materializer.zip" \
              "DashboardOrigin=${dashboard_origin}" \
            --capabilities CAPABILITY_NAMED_IAM --region "$AWS_REGION" --no-fail-on-empty-changeset

      - name: Show deployment outputs
        shell: bash
        run: |
          set -euo pipefail
          for stack in \
            "medislot-${ENVIRONMENT_NAME}-authentication" \
            "medislot-${ENVIRONMENT_NAME}-schema-init" \
            "medislot-${ENVIRONMENT_NAME}-dashboard"; do
            echo "Outputs for $stack"
            aws cloudformation describe-stacks --stack-name "$stack" \
              --query 'Stacks[0].Outputs' --output table --region "$AWS_REGION"
          done
