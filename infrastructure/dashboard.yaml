AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MediSlot doctor dashboard host. Creates one Amazon Linux 2023 EC2 instance
  in the existing public subnet and reuses the existing EC2 security group.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: MediSlot deployment environment.

  DashboardArtifactBucket:
    Type: String
    Description: Existing private S3 bucket used for versioned deployment artifacts.

  DashboardArtifactS3Key:
    Type: String
    Description: S3 object key for the packaged dashboard application.

  ApiBaseUrl:
    Type: String
    Description: Base URL exported by the authentication API stack, including the stage.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: EC2 instance size for the Flask dashboard host.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI published by AWS.

Resources:
  DashboardInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${EnvironmentName}-dashboard-ec2-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDashboardDeploymentArtifact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${DashboardArtifactBucket}/${DashboardArtifactS3Key}
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub medislot-${EnvironmentName}-dashboard-instance-profile
      Roles:
        - !Ref DashboardInstanceRole

  DashboardInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DashboardInstanceProfile
      SubnetId:
        Fn::ImportValue: !Sub medislot-${EnvironmentName}-PublicSubnetId
      SecurityGroupIds:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-EC2SecurityGroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/medislot-dashboard-setup.log) 2>&1

          dnf update -y
          dnf install -y python3 python3-pip nginx unzip awscli-2

          mkdir -p /opt/medislot /var/lib/medislot/sessions
          aws s3 cp "s3://${DashboardArtifactBucket}/${DashboardArtifactS3Key}" /tmp/medislot-dashboard.zip --region ${AWS::Region}
          unzip -o /tmp/medislot-dashboard.zip -d /opt/medislot
          chown -R ec2-user:ec2-user /opt/medislot
          chown -R ec2-user:ec2-user /var/lib/medislot

          cat > /etc/medislot-dashboard.env <<ENVVARS
          MEDISLOT_API_BASE_URL=${ApiBaseUrl}
          FLASK_SECRET_KEY=$(openssl rand -hex 32)
          SESSION_FILE_DIR=/var/lib/medislot/sessions
          SESSION_COOKIE_SECURE=false
          ENVVARS
          chown root:ec2-user /etc/medislot-dashboard.env
          chmod 640 /etc/medislot-dashboard.env

          python3 -m venv /opt/medislot/.venv
          /opt/medislot/.venv/bin/pip install --upgrade pip
          /opt/medislot/.venv/bin/pip install -r /opt/medislot/dashboard/requirements.txt gunicorn

          cat > /etc/systemd/system/medislot-dashboard.service <<'SERVICE'
          [Unit]
          Description=MediSlot Flask Doctor Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          Group=ec2-user
          WorkingDirectory=/opt/medislot
          EnvironmentFile=/etc/medislot-dashboard.env
          ExecStart=/opt/medislot/.venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 dashboard.app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          rm -f /etc/nginx/conf.d/default.conf
          cat > /etc/nginx/conf.d/medislot-dashboard.conf <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;
              client_max_body_size 10m;
              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX

          nginx -t
          systemctl daemon-reload
          systemctl enable --now medislot-dashboard
          systemctl enable --now nginx
      Tags:
        - Key: Name
          Value: !Sub medislot-${EnvironmentName}-dashboard-ec2
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  DashboardInstanceId:
    Description: EC2 instance hosting the MediSlot doctor dashboard.
    Value: !Ref DashboardInstance

  DashboardPublicIp:
    Description: Public IPv4 address of the dashboard host.
    Value: !GetAtt DashboardInstance.PublicIp

  DashboardPublicDns:
    Description: Public DNS name of the dashboard host.
    Value: !GetAtt DashboardInstance.PublicDnsName

  DashboardUrl:
    Description: HTTP URL for the MediSlot doctor dashboard.
    Value: !Sub http://${DashboardInstance.PublicDnsName}/doctor/dashboard
