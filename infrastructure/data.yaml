
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MediSlot development data stack:
  private RDS MySQL, DynamoDB tables, and private S3 buckets.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Environment name used for resource naming.

Resources:

  # ------------------------------------------------------------
  # RDS NETWORKING
  # ------------------------------------------------------------

  MediSlotDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "MediSlot ${EnvironmentName} private DB subnets"
      SubnetIds:
        - Fn::ImportValue:
            !Sub "medislot-${EnvironmentName}-PrivateSubnetAId"
        - Fn::ImportValue:
            !Sub "medislot-${EnvironmentName}-PrivateSubnetBId"
      Tags:
        - Key: Name
          Value: !Sub "medislot-${EnvironmentName}-db-subnet-group"
        - Key: Environment
          Value: !Ref EnvironmentName

  # ------------------------------------------------------------
  # RDS MYSQL
  # ------------------------------------------------------------

  MediSlotDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "medislot-${EnvironmentName}-mysql"
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: medislot
      MasterUsername: medislotadmin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref MediSlotDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue:
            !Sub "medislot-${EnvironmentName}-RDSSecurityGroupId"
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "medislot-${EnvironmentName}-mysql"
        - Key: Environment
          Value: !Ref EnvironmentName

  # ------------------------------------------------------------
  # DYNAMODB: REFRESH TOKENS
  # One user can have multiple active sessions.
  # Store a hash/identifier of the opaque refresh token, not the
  # raw token. expires_at is Unix epoch seconds for DynamoDB TTL.
  # ------------------------------------------------------------

  
  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "medislot-${EnvironmentName}-refresh-tokens"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: token_id
          AttributeType: S
        - AttributeName: token_hash
          AttributeType: S

      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: token_id
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: RefreshTokenHashIndex
          KeySchema:
            - AttributeName: token_hash
              KeyType: HASH
          Projection:
            ProjectionType: ALL

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName


  # ------------------------------------------------------------
  # DYNAMODB: APPOINTMENTS (Milestone 5)
  # Appointments live in DynamoDB; slots live in RDS (the `slots` table).
  # Partition key appointment_id (32 hex characters). Three indexes:
  #   PatientIndex (patient_id, start_time_utc)  a patient's appointments
  #   DoctorIndex  (doctor_id,  start_time_utc)  a doctor's appointments
  #   SlotIndex    (slot_id)                     every appointment of one slot
  # Items whose key starts with HOLD# enforce one active appointment per patient per slot;
  # they have none of the index attributes, so they never appear in the indexes.
  # ------------------------------------------------------------

  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "medislot-${EnvironmentName}-appointments"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: appointment_id
          AttributeType: S
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: doctor_id
          AttributeType: S
        - AttributeName: slot_id
          AttributeType: S
        - AttributeName: start_time_utc
          AttributeType: S
      KeySchema:
        - AttributeName: appointment_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PatientIndex
          KeySchema:
            - AttributeName: patient_id
              KeyType: HASH
            - AttributeName: start_time_utc
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: DoctorIndex
          KeySchema:
            - AttributeName: doctor_id
              KeyType: HASH
            - AttributeName: start_time_utc
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SlotIndex
          KeySchema:
            - AttributeName: slot_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ------------------------------------------------------------
  # DYNAMODB: BOOKING IDEMPOTENCY (Milestone 5)
  # One item per Idempotency-Key (patient_id#key). The first request stores
  # IN_PROGRESS, then the final response; a replay returns that response and never
  # books again. expires_at is Unix epoch seconds for DynamoDB TTL (24 hours).
  # ------------------------------------------------------------

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "medislot-${EnvironmentName}-idempotency"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ------------------------------------------------------------
  # EVENTBRIDGE: BUSINESS EVENTS (Milestone 5)
  # AppointmentBooked, AppointmentCancelled and SlotSeatFreed are published here
  # (source medislot.booking). Later milestones attach rules and targets, e.g. the
  # waitlist promotion consumer for SlotSeatFreed.
  # ------------------------------------------------------------

  MediSlotEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "medislot-${EnvironmentName}-events"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ------------------------------------------------------------
  # S3: REPORTS
  # Bucket names include account and region to reduce collisions.
  # ------------------------------------------------------------

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "medislot-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-reports"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ReportsBucket.Arn
              - !Sub "${ReportsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ------------------------------------------------------------
  # S3: APPLICATION ASSETS
  # ------------------------------------------------------------

  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "medislot-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-assets"
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AssetsBucket.Arn
              - !Sub "${AssetsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ------------------------------------------------------------
  # DATABASE CONNECTION SETTINGS IN SSM PARAMETER STORE
  # The password remains in the RDS-managed Secrets Manager secret.
  # ------------------------------------------------------------

  DatabaseHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/database/host
      Type: String
      Value: !GetAtt MediSlotDatabase.Endpoint.Address
      Description: Private RDS endpoint hostname
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  DatabasePortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/database/port
      Type: String
      Value: !GetAtt MediSlotDatabase.Endpoint.Port
      Description: RDS MySQL port
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  DatabaseNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/database/name
      Type: String
      Value: medislot
      Description: MediSlot database name
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  DatabaseUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/database/username
      Type: String
      Value: medislotadmin
      Description: RDS master username; password remains RDS-managed in Secrets Manager
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  # ------------------------------------------------------------
  # BOOKING AND REFUND CONFIGURATION (Milestone 5)
  # Change these values in Parameter Store to change behaviour; no redeploy is
  # needed (Lambdas re-read them about once a minute). Tiers are listed from the
  # longest to the shortest notice. A tier matches when the time left is at least
  # min_hours, or strictly more than min_hours when "inclusive" is false. The last
  # tier must start at 0 hours so every cancellation matches a tier.
  # ------------------------------------------------------------

  RefundPolicyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/booking/refund-policy
      Type: String
      Tier: Standard
      Value: >-
        {"currency":"INR","tiers":[
        {"name":"GT_48H","min_hours":48,"inclusive":false,"percent":100},
        {"name":"24H_TO_48H","min_hours":24,"inclusive":true,"percent":75},
        {"name":"6H_TO_24H","min_hours":6,"inclusive":true,"percent":50},
        {"name":"LT_6H","min_hours":0,"inclusive":true,"percent":0}]}
      Description: Refund tiers (notice windows and percentages) for patient cancellations
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  MaxUpcomingPerDoctorParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/booking/max-upcoming-per-doctor
      Type: String
      Value: "3"
      Description: Most upcoming appointments one patient may hold with the same doctor
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  MaxConflictRetriesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/booking/max-conflict-retries
      Type: String
      Value: "6"
      Description: How many times a booking retries a slot write that lost an optimistic-concurrency race
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

Outputs:
  DatabaseEndpointAddress:
    Description: Private RDS endpoint hostname.
    Value: !GetAtt MediSlotDatabase.Endpoint.Address
    Export:
      Name: !Sub "medislot-${EnvironmentName}-DatabaseEndpointAddress"

  DatabaseEndpointPort:
    Description: RDS MySQL port.
    Value: !GetAtt MediSlotDatabase.Endpoint.Port
    Export:
      Name: !Sub "medislot-${EnvironmentName}-DatabaseEndpointPort"

  DatabaseName:
    Value: medislot
    Export:
      Name: !Sub "medislot-${EnvironmentName}-DatabaseName"

  DatabaseSecretArn:
    Description: Secrets Manager ARN containing the RDS master credentials.
    Value: !GetAtt MediSlotDatabase.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "medislot-${EnvironmentName}-DatabaseSecretArn"

  RefreshTokensTableName:
    Value: !Ref RefreshTokensTable
    Export:
      Name: !Sub "medislot-${EnvironmentName}-RefreshTokensTableName"

  AppointmentsTableName:
    Value: !Ref AppointmentsTable
    Export:
      Name: !Sub "medislot-${EnvironmentName}-AppointmentsTableName"

  ReportsBucketName:
    Value: !Ref ReportsBucket
    Export:
      Name: !Sub "medislot-${EnvironmentName}-ReportsBucketName"

  AssetsBucketName:
    Value: !Ref AssetsBucket
    Export:
      Name: !Sub "medislot-${EnvironmentName}-AssetsBucketName"

  IdempotencyTableName:
    Value: !Ref IdempotencyTable
    Export:
      Name: !Sub "medislot-${EnvironmentName}-IdempotencyTableName"

  EventBusName:
    Value: !Ref MediSlotEventBus
    Export:
      Name: !Sub "medislot-${EnvironmentName}-EventBusName"

  EventBusArn:
    Value: !GetAtt MediSlotEventBus.Arn
    Export:
      Name: !Sub "medislot-${EnvironmentName}-EventBusArn"
