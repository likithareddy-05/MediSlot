
name: MediSlot Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: medislot-infrastructure-dev
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    # Development deployments only from feature.
    if: github.ref == 'refs/heads/feature'

    env:
      AWS_REGION: eu-north-1
      ENVIRONMENT_NAME: dev
      ARTIFACT_BUCKET: ${{ vars.MEDISLOT_ARTIFACT_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::201261380083:role/MediSlotGitHubActionsRole
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Validate all templates before making infrastructure changes.
      - name: Validate Network template
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/network.yaml \
            --region "$AWS_REGION"

      - name: Validate Data template
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/data.yaml \
            --region "$AWS_REGION"

      - name: Validate Security template
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/security.yaml \
            --region "$AWS_REGION"

      - name: Validate Authentication template
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/authentication.yaml \
            --region "$AWS_REGION"

      # Network must finish successfully before Data is deployed.
      - name: Deploy Network Stack
        shell: bash
        run: |
          set -euo pipefail

          deploy_stack() {
            local stack_name="$1"
            local template_file="$2"
            local change_set_name
            local change_set_type
            local reason
            local status

            change_set_name="${stack_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            if aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
              change_set_type="UPDATE"
            else
              change_set_type="CREATE"
            fi

            echo "Deploying $stack_name using $change_set_type"

            aws cloudformation create-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --change-set-type "$change_set_type" \
              --template-body "file://${template_file}" \
              --parameters \
                "ParameterKey=EnvironmentName,ParameterValue=${ENVIRONMENT_NAME}" \
              --region "$AWS_REGION"

            if ! aws cloudformation wait change-set-create-complete \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION"; then

              status=$(aws cloudformation describe-change-set \
                --stack-name "$stack_name" \
                --change-set-name "$change_set_name" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text)

              reason=$(aws cloudformation describe-change-set \
                --stack-name "$stack_name" \
                --change-set-name "$change_set_name" \
                --region "$AWS_REGION" \
                --query 'StatusReason' \
                --output text)

              if [[ "$status" == "FAILED" ]] &&
                 [[ "$reason" == *"didn't contain changes"* ||
                    "$reason" == *"No updates are to be performed"* ]]; then
                echo "No changes required for $stack_name."
                return 0
              fi

              echo "Change set failed: $reason"
              return 1
            fi

            echo "Planned changes:"
            aws cloudformation describe-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION" \
              --query 'Changes[*].ResourceChange.{Action:Action,Type:ResourceType,LogicalId:LogicalResourceId}' \
              --output table

            aws cloudformation execute-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION"

            if [[ "$change_set_type" == "CREATE" ]]; then
              aws cloudformation wait stack-create-complete \
                --stack-name "$stack_name" \
                --region "$AWS_REGION"
            else
              aws cloudformation wait stack-update-complete \
                --stack-name "$stack_name" \
                --region "$AWS_REGION"
            fi

            echo "$stack_name deployment completed."
          }

          deploy_stack \
            "medislot-${ENVIRONMENT_NAME}-network" \
            "infrastructure/network.yaml"

      - name: Verify Network Stack exports
        shell: bash
        run: |
          set -euo pipefail

          for export_name in \
            "medislot-${ENVIRONMENT_NAME}-PrivateSubnetAId" \
            "medislot-${ENVIRONMENT_NAME}-PrivateSubnetBId" \
            "medislot-${ENVIRONMENT_NAME}-RDSSecurityGroupId"
          do
            found=$(aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='${export_name}'].Name | [0]" \
              --output text)

            if [[ "$found" != "$export_name" ]]; then
              echo "Required network export is missing: $export_name"
              exit 1
            fi
          done

          echo "Required network exports are available."

      - name: Deploy Data Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="medislot-${ENVIRONMENT_NAME}-data"
          TEMPLATE_FILE="infrastructure/data.yaml"
          CHANGE_SET_NAME="${STACK_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            CHANGE_SET_TYPE="UPDATE"
          else
            CHANGE_SET_TYPE="CREATE"
          fi

          echo "Deploying $STACK_NAME using $CHANGE_SET_TYPE"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type "$CHANGE_SET_TYPE" \
            --template-body "file://${TEMPLATE_FILE}" \
            --parameters \
              "ParameterKey=EnvironmentName,ParameterValue=${ENVIRONMENT_NAME}" \
            --region "$AWS_REGION"

          if ! aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"; then

            STATUS=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text)

            REASON=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION" \
              --query 'StatusReason' \
              --output text)

            if [[ "$STATUS" == "FAILED" ]] &&
               [[ "$REASON" == *"didn't contain changes"* ||
                  "$REASON" == *"No updates are to be performed"* ]]; then
              echo "No changes required for $STACK_NAME."
              exit 0
            fi

            echo "Data change set failed: $REASON"
            exit 1
          fi

          echo "Planned data stack changes:"
          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION" \
            --query 'Changes[*].ResourceChange.{Action:Action,Type:ResourceType,LogicalId:LogicalResourceId}' \
            --output table

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"

          if [[ "$CHANGE_SET_TYPE" == "CREATE" ]]; then
            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          else
            aws cloudformation wait stack-update-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          fi

          echo "Data stack deployment completed."

      # --------------------------------------------------
      # Deploy Security Stack after Data Stack
      # --------------------------------------------------
      - name: Deploy Security Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="medislot-${ENVIRONMENT_NAME}-security"
          TEMPLATE_FILE="infrastructure/security.yaml"
          CHANGE_SET_NAME="${STACK_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            CHANGE_SET_TYPE="UPDATE"
          else
            CHANGE_SET_TYPE="CREATE"
          fi

          echo "Deploying $STACK_NAME using $CHANGE_SET_TYPE"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type "$CHANGE_SET_TYPE" \
            --template-body "file://${TEMPLATE_FILE}" \
            --parameters \
              "ParameterKey=EnvironmentName,ParameterValue=${ENVIRONMENT_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"

          if ! aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"; then

            STATUS=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text)

            REASON=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION" \
              --query 'StatusReason' \
              --output text)

            if [[ "$STATUS" == "FAILED" ]] &&
               [[ "$REASON" == *"didn't contain changes"* ||
                  "$REASON" == *"No updates are to be performed"* ]]; then
              echo "No changes required for $STACK_NAME."
              exit 0
            fi

            echo "Security change set failed: $REASON"
            exit 1
          fi

          echo "Planned security stack changes:"
          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION" \
            --query 'Changes[*].ResourceChange.{Action:Action,Type:ResourceType,LogicalId:LogicalResourceId}' \
            --output table

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"

          if [[ "$CHANGE_SET_TYPE" == "CREATE" ]]; then
            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          else
            aws cloudformation wait stack-update-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          fi

          echo "Security stack deployment completed."

      # --------------------------------------------------
      # Package and upload authentication Lambda functions
      # --------------------------------------------------
      - name: Package Authentication Lambdas
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ARTIFACT_BUCKET:-}" || "$ARTIFACT_BUCKET" == "null" ]]; then
            echo "Repository variable MEDISLOT_ARTIFACT_BUCKET is not configured."
            exit 1
          fi

          python -m pip install --upgrade pip
          mkdir -p build/lambdas

          package_lambda() {
            local source_file="$1"
            local package_name="$2"
            local package_dir="build/${package_name}"

            rm -rf "$package_dir"
            mkdir -p "$package_dir"

            python -m pip install \
              --only-binary=:all: \
              -r lambdas/requirements.txt \
              -t "$package_dir"

            cp "lambdas/${source_file}" "$package_dir/"
            (cd "$package_dir" && zip -qr "../lambdas/${package_name}.zip" .)

            aws s3 cp \
              "build/lambdas/${package_name}.zip" \
              "s3://${ARTIFACT_BUCKET}/artifacts/${GITHUB_SHA}/${package_name}.zip" \
              --region "$AWS_REGION"
          }

          package_lambda register.py register
          package_lambda auth.py login
          package_lambda refresh.py refresh
          package_lambda logout.py logout
          package_lambda authorizer.py authorizer

      # --------------------------------------------------
      # Deploy Authentication Stack after Security Stack
      # --------------------------------------------------
      - name: Deploy Authentication Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="medislot-${ENVIRONMENT_NAME}-authentication"
          TEMPLATE_FILE="infrastructure/authentication.yaml"
          CHANGE_SET_NAME="${STACK_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if [[ -z "${ARTIFACT_BUCKET:-}" || "$ARTIFACT_BUCKET" == "null" ]]; then
            echo "Repository variable MEDISLOT_ARTIFACT_BUCKET is not configured."
            exit 1
          fi

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            CHANGE_SET_TYPE="UPDATE"
          else
            CHANGE_SET_TYPE="CREATE"
          fi

          echo "Deploying $STACK_NAME using $CHANGE_SET_TYPE"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type "$CHANGE_SET_TYPE" \
            --template-body "file://${TEMPLATE_FILE}" \
            --parameters \
              "ParameterKey=EnvironmentName,ParameterValue=${ENVIRONMENT_NAME}" \
              "ParameterKey=LambdaArtifactBucket,ParameterValue=${ARTIFACT_BUCKET}" \
              "ParameterKey=RegisterLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/register.zip" \
              "ParameterKey=LoginLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/login.zip" \
              "ParameterKey=RefreshLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/refresh.zip" \
              "ParameterKey=LogoutLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/logout.zip" \
              "ParameterKey=AuthorizerLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/authorizer.zip" \
            --region "$AWS_REGION"

          if ! aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"; then

            STATUS=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text)

            REASON=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION" \
              --query 'StatusReason' \
              --output text)

            if [[ "$STATUS" == "FAILED" ]] &&
               [[ "$REASON" == *"didn't contain changes"* ||
                  "$REASON" == *"No updates are to be performed"* ]]; then
              echo "No changes required for $STACK_NAME."
              exit 0
            fi

            echo "Authentication change set failed: $REASON"
            exit 1
          fi

          echo "Planned authentication stack changes:"
          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION" \
            --query 'Changes[*].ResourceChange.{Action:Action,Type:ResourceType,LogicalId:LogicalResourceId}' \
            --output table

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"

          if [[ "$CHANGE_SET_TYPE" == "CREATE" ]]; then
            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          else
            aws cloudformation wait stack-update-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          fi

          echo "Authentication stack deployment completed."

      - name: Show Network Stack outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT_NAME}-network" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
            --output json

      - name: Show Data Stack outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT_NAME}-data" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
            --output json

      - name: Show Security Stack outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT_NAME}-security" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
            --output json

      - name: Show Authentication Stack outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT_NAME}-authentication" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
            --output json
