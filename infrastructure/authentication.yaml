      - DoctorAvailabilityIdPutMethod
      - DoctorAvailabilityIdDeleteMethod
      - DoctorBlackoutIdDeleteMethod
      - DoctorAppointmentOutcomePostMethod
      - DoctorSlotIdDeleteMethod
      - DoctorMaterializePostMethod
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Description: !Sub MediSlot ${EnvironmentName} explicit authentication and doctor API routes

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
