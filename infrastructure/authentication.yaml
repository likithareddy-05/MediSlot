AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot authentication stack containing registration, login,
  refresh, logout, JWT authorization, and API Gateway resources.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing packaged Lambda deployment ZIP files.

  AuthLambdaS3Key:
    Type: String
    Description: S3 key for the consolidated register/login/refresh/logout Lambda package.

  AuthorizerLambdaS3Key:
    Type: String

  ProfileLambdaS3Key:
    Type: String
    Description: S3 key for the authenticated account-details Lambda package.

  DoctorDomainLambdaS3Key:
    Type: String
    Description: S3 key for the doctor-domain API and slot materialiser package.

Resources:
  # ---------------------------------------------------------
  # CONSOLIDATED AUTH LAMBDA
  # Routes register/login/refresh/logout internally by method + path.
  # ---------------------------------------------------------
  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-auth
      Description: Handles registration, login, refresh, and logout.
      Runtime: python3.12
      Handler: auth_handler.lambda_handler
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref AuthLambdaS3Key
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /medislot/${EnvironmentName}/database/host
          DB_PORT_PARAMETER: !Sub /medislot/${EnvironmentName}/database/port
          DB_NAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/name
          DB_USERNAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/username
          DB_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-DatabaseSecretArn
          BCRYPT_WORK_FACTOR_PARAMETER: !Sub /medislot/${EnvironmentName}/auth/bcrypt-work-factor
          JWT_SIGNING_SECRET_PARAMETER: !Sub /medislot/${EnvironmentName}/auth/jwt-signing-secret
          JWT_ISSUER: medislot
          REFRESH_TOKENS_TABLE:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-RefreshTokensTableName
          ACCESS_TOKEN_TTL_PARAMETER: !Sub /medislot/${EnvironmentName}/auth/access-token-ttl-seconds
          REFRESH_TOKEN_TTL_PARAMETER: !Sub /medislot/${EnvironmentName}/auth/refresh-token-ttl-seconds

  # ---------------------------------------------------------
  # JWT AUTHORIZER LAMBDA
  # ---------------------------------------------------------
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-auth-authorizer
      Description: Validates JWT signature, issuer, expiry, and role without a denylist.
      Runtime: python3.12
      Handler: authorizer.lambda_handler
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref AuthorizerLambdaS3Key
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthAuthorizerRoleArn
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          JWT_SIGNING_SECRET_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/auth/jwt-signing-secret
          JWT_ISSUER: medislot
          ROLE_ROUTE_RULES: '{"GET /doctor/*":"DOCTOR","POST /doctor/*":"DOCTOR","PUT /doctor/*":"DOCTOR","PATCH /doctor/*":"DOCTOR","DELETE /doctor/*":"DOCTOR","GET /patient/*":"PATIENT","POST /patient/*":"PATIENT","PUT /patient/*":"PATIENT","PATCH /patient/*":"PATIENT","DELETE /patient/*":"PATIENT","POST /auth/logout":["DOCTOR","PATIENT"]}'

  # ---------------------------------------------------------
  # AUTHENTICATED ACCOUNT DETAILS LAMBDA
  # Returns only the current caller's row from the users table.
  # ---------------------------------------------------------
  ProfileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-account-profile
      Description: Returns the authenticated patient's or doctor's account details.
      Runtime: python3.12
      Handler: profile.lambda_handler
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref ProfileLambdaS3Key
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/database/host
          DB_PORT_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/database/port
          DB_NAME_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/database/name
          DB_USERNAME_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/database/username
          DB_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-DatabaseSecretArn

  # ---------------------------------------------------------
  # MILESTONE 3 DOCTOR DOMAIN API + MATERIALISER
  # Existing authentication/profile functions remain unchanged.
  # ---------------------------------------------------------
  DoctorDomainFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-doctor-domain
      Description: Doctor profile, consultations, availability, blackouts, schedule and slot materialisation.
      Runtime: python3.12
      Handler: doctor_domain.lambda_handler
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref DoctorDomainLambdaS3Key
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthLambdaRoleArn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /medislot/${EnvironmentName}/database/host
          DB_PORT_PARAMETER: !Sub /medislot/${EnvironmentName}/database/port
          DB_NAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/name
          DB_USERNAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/username
          DB_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-DatabaseSecretArn
          SLOT_STATE_TABLE:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-SlotStateTableName
          ASSETS_BUCKET:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-AssetsBucketName

  DoctorDomainMaterializerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-slot-materializer
      Description: Daily idempotent rolling 30-day doctor slot materialisation.
      Runtime: python3.12
      Handler: doctor_domain.materializer_handler
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref DoctorDomainLambdaS3Key
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthLambdaRoleArn
      Timeout: 300
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /medislot/${EnvironmentName}/database/host
          DB_PORT_PARAMETER: !Sub /medislot/${EnvironmentName}/database/port
          DB_NAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/name
          DB_USERNAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/username
          DB_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-DatabaseSecretArn
          SLOT_STATE_TABLE:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-SlotStateTableName
          ASSETS_BUCKET:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-AssetsBucketName

  SlotMaterializerScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSlotMaterializer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DoctorDomainMaterializerFunction.Arn

  SlotMaterializerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub medislot-${EnvironmentName}-slot-materializer-daily
      Description: Materialize the next rolling 30 days of doctor slots daily.
      FlexibleTimeWindow:
        Mode: OFF
      ScheduleExpression: cron(0 1 * * ? *)
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      Target:
        Arn: !GetAtt DoctorDomainMaterializerFunction.Arn
        RoleArn: !GetAtt SlotMaterializerScheduleRole.Arn
        Input: '{}'

  # ---------------------------------------------------------
  # API GATEWAY REST API
  # ---------------------------------------------------------
  MediSlotRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub medislot-${EnvironmentName}-api
      Description: MediSlot authentication REST API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ---------------------------------------------------------
  # AUTHORIZATION CONFIGURATION
  # ---------------------------------------------------------
  JwtAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub medislot-${EnvironmentName}-jwt-authorizer
      RestApiId: !Ref MediSlotRestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt AuthorizerFunction.Arn
      AuthorizerCredentials:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn

  # ---------------------------------------------------------
  # /auth
  # ---------------------------------------------------------
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: auth

  # ---------------------------------------------------------
  # /auth/register
  # ---------------------------------------------------------
  RegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: register

  RegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref RegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  # ---------------------------------------------------------
  # /auth/login
  # ---------------------------------------------------------
  LoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: login

  LoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref LoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  # ---------------------------------------------------------
  # /auth/refresh
  # ---------------------------------------------------------
  RefreshResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: refresh

  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref RefreshResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  # ---------------------------------------------------------
  # /auth/logout
  # ---------------------------------------------------------
  LogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: logout

  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref LogoutResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  # ---------------------------------------------------------
  # /patient/me - current authenticated patient's account details
  # ---------------------------------------------------------
  PatientResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: patient

  PatientMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref PatientResource
      PathPart: me

  PatientMeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref PatientMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProfileFunction.Arn

  # ---------------------------------------------------------
  # /doctor/me - current authenticated doctor's account details
  # ---------------------------------------------------------
  DoctorResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: doctor

  DoctorMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorResource
      PathPart: me

  DoctorMeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProfileFunction.Arn

  # ---------------------------------------------------------
  # /doctor/{proxy+} - Milestone 3 authenticated doctor domain API
  # Existing /doctor/me method above remains mapped to account-profile.
  # ---------------------------------------------------------
  DoctorProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorResource
      PathPart: "{proxy+}"

  DoctorProxyOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorProxyResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorProxyResource
      HttpMethod: ANY
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  # ---------------------------------------------------------
  # API DEPLOYMENT
  # ---------------------------------------------------------
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - RegisterMethod
      - LoginMethod
      - RefreshMethod
      - LogoutMethod
      - PatientMeMethod
      - DoctorMeMethod
      - DoctorProxyMethod
      - DoctorProxyOptionsMethod
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Description: !Sub MediSlot ${EnvironmentName} authentication and doctor-domain API deployment v3

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref MediSlotRestApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref EnvironmentName
      Description: !Sub MediSlot ${EnvironmentName} stage

Outputs:
  RestApiId:
    Description: MediSlot REST API ID
    Value: !Ref MediSlotRestApi
    Export:
      Name: !Sub medislot-${EnvironmentName}-RestApiId

  RestApiBaseUrl:
    Description: Base URL for the MediSlot REST API
    Value: !Sub https://${MediSlotRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}
    Export:
      Name: !Sub medislot-${EnvironmentName}-RestApiBaseUrl

  AuthFunctionArn:
    Value: !GetAtt AuthFunction.Arn

  AuthorizerFunctionArn:
    Value: !GetAtt AuthorizerFunction.Arn

  ProfileFunctionArn:
    Value: !GetAtt ProfileFunction.Arn

  DoctorDomainFunctionArn:
    Value: !GetAtt DoctorDomainFunction.Arn

  SlotMaterializerFunctionArn:
    Value: !GetAtt DoctorDomainMaterializerFunction.Arn
