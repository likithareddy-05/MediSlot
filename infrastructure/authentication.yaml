AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot authentication stack containing registration, login,
  refresh, logout, JWT authorization, and API Gateway resources.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing packaged Lambda deployment ZIP files.

  AuthLambdaS3Key:
    Type: String
    Description: S3 key for the consolidated register/login/refresh/logout Lambda package.

  AuthorizerLambdaS3Key:
    Type: String

  ProfileLambdaS3Key:
    Type: String
    Description: S3 key for the authenticated account-details Lambda package.

  DoctorDomainLambdaS3Key:
    Type: String
    Description: S3 key for the doctor-domain Lambda package
  SlotMaterializerLambdaS3Key:
    Type: String
    Description: S3 key for the slot materializer Lambda package

Resources:
  # ---------------------------------------------------------
  # CONSOLIDATED AUTH LAMBDA
  # Routes register/login/refresh/logout internally by method + path.
  # ---------------------------------------------------------
  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-auth
      Description: Handles registration, login, refresh, and logout.
      Runtime: python3.12
      Handler: auth_handler.lambda_handler
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref AuthLambdaS3Key
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /medislot/${EnvironmentName}/database/host
          DB_PORT_PARAMETER: !Sub /medislot/${EnvironmentName}/database/port
          DB_NAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/name
          DB_USERNAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/username
          DB_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-DatabaseSecretArn
          BCRYPT_WORK_FACTOR_PARAMETER: !Sub /medislot/${EnvironmentName}/auth/bcrypt-work-factor
          JWT_SIGNING_SECRET_PARAMETER: !Sub /medislot/${EnvironmentName}/auth/jwt-signing-secret
          JWT_ISSUER: medislot
          REFRESH_TOKENS_TABLE:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-RefreshTokensTableName
          ACCESS_TOKEN_TTL_PARAMETER: !Sub /medislot/${EnvironmentName}/auth/access-token-ttl-seconds
          REFRESH_TOKEN_TTL_PARAMETER: !Sub /medislot/${EnvironmentName}/auth/refresh-token-ttl-seconds

  # ---------------------------------------------------------
  # JWT AUTHORIZER LAMBDA
  # ---------------------------------------------------------
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-auth-authorizer
      Description: Validates JWT signature, issuer, expiry, and role without a denylist.
      Runtime: python3.12
      Handler: authorizer.lambda_handler
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref AuthorizerLambdaS3Key
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthAuthorizerRoleArn
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          JWT_SIGNING_SECRET_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/auth/jwt-signing-secret
          JWT_ISSUER: medislot
          ROLE_ROUTE_RULES: '{"GET /doctor/*":"DOCTOR","POST /doctor/*":"DOCTOR","PUT /doctor/*":"DOCTOR","PATCH /doctor/*":"DOCTOR","DELETE /doctor/*":"DOCTOR","GET /doctors/*":"DOCTOR","POST /doctors/*":"DOCTOR","PUT /doctors/*":"DOCTOR","PATCH /doctors/*":"DOCTOR","DELETE /doctors/*":"DOCTOR","GET /patient/*":"PATIENT","POST /patient/*":"PATIENT","PUT /patient/*":"PATIENT","PATCH /patient/*":"PATIENT","DELETE /patient/*":"PATIENT","POST /auth/logout":["DOCTOR","PATIENT"]}'

  # ---------------------------------------------------------
  # AUTHENTICATED ACCOUNT DETAILS LAMBDA
  # Returns only the current caller's row from the users table.
  # ---------------------------------------------------------
  ProfileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-account-profile
      Description: Returns the authenticated patient's or doctor's account details.
      Runtime: python3.12
      Handler: profile.lambda_handler
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref ProfileLambdaS3Key
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/database/host
          DB_PORT_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/database/port
          DB_NAME_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/database/name
          DB_USERNAME_PARAMETER:
            Fn::Sub: /medislot/${EnvironmentName}/database/username
          DB_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-DatabaseSecretArn

  # ---------------------------------------------------------
  # API GATEWAY REST API
  # ---------------------------------------------------------
  MediSlotRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub medislot-${EnvironmentName}-api
      Description: MediSlot authentication REST API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ---------------------------------------------------------
  # AUTHORIZATION CONFIGURATION
  # ---------------------------------------------------------
  JwtAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub medislot-${EnvironmentName}-jwt-authorizer
      RestApiId: !Ref MediSlotRestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt AuthorizerFunction.Arn
      AuthorizerCredentials:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn

  # ---------------------------------------------------------
  # /auth
  # ---------------------------------------------------------
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: auth

  # ---------------------------------------------------------
  # /auth/register
  # ---------------------------------------------------------
  RegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: register

  RegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref RegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  # ---------------------------------------------------------
  # /auth/login
  # ---------------------------------------------------------
  LoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: login

  LoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref LoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn


  # ---------------------------------------------------------
  # Explicit doctor registration/login aliases; same shared auth handlers.
  # ---------------------------------------------------------
  AuthDoctorsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: doctors

  AuthDoctorsRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthDoctorsResource
      PathPart: register

  AuthDoctorsRegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthDoctorsRegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  AuthDoctorsLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthDoctorsResource
      PathPart: login

  AuthDoctorsLoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthDoctorsLoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  # ---------------------------------------------------------
  # /auth/refresh
  # ---------------------------------------------------------
  RefreshResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: refresh

  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref RefreshResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  # ---------------------------------------------------------
  # /auth/logout
  # ---------------------------------------------------------
  LogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthResource
      PathPart: logout

  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref LogoutResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt AuthFunction.Arn

  # ---------------------------------------------------------
  # /patient/me - current authenticated patient's account details
  # ---------------------------------------------------------
  PatientResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: patient

  PatientMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref PatientResource
      PathPart: me

  PatientMeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref PatientMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProfileFunction.Arn

  # ---------------------------------------------------------
  # API DEPLOYMENT
  # ---------------------------------------------------------

  # ---------------------------------------------------------
  # Milestone 3: Doctor domain API (greedy proxy under /doctors)
  # ---------------------------------------------------------
  DoctorDomainFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-doctor-domain
      Runtime: python3.12
      Handler: doctor_domain.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthLambdaRoleArn
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref DoctorDomainLambdaS3Key
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /medislot/${EnvironmentName}/database/host
          DB_PORT_PARAMETER: !Sub /medislot/${EnvironmentName}/database/port
          DB_NAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/name
          DB_USERNAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/username
          DB_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-DatabaseSecretArn
          SLOT_TABLE_NAME:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-SlotStateTableName
          ASSETS_BUCKET:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-AssetsBucketName
          MATERIALIZER_FUNCTION_NAME: !Sub medislot-${EnvironmentName}-slot-materializer

  DoctorsRootResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: doctors

  DoctorsMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsRootResource
      PathPart: me

  DoctorsMeGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorsMePutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorPhotoResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: photo

  DoctorPhotoPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorPhotoResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorConsultationTypesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: consultation-types

  DoctorConsultationTypesGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorConsultationTypesResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorConsultationTypesPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorConsultationTypesResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorAvailabilityResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: availability

  DoctorAvailabilityGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorAvailabilityResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorAvailabilityPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorAvailabilityResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorAvailabilityPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorAvailabilityResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorBlackoutsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: blackouts

  DoctorBlackoutsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorBlackoutsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorBlackoutsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorBlackoutsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorScheduleResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: schedule

  DoctorScheduleGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorScheduleResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  DoctorAppointmentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: appointments

  DoctorAppointmentsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorAppointmentsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn

  # Explicit item-level routes supported by doctor_domain.py.
  DoctorConsultationTypeIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorConsultationTypesResource
      PathPart: "{consultationTypeId}"

  DoctorConsultationTypeIdPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorConsultationTypeIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::ImportValue:
            Fn::Sub: medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn
        Uri:
