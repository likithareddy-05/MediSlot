        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt DoctorDomainFunction.Arn
  DoctorDomainInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DoctorDomainFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotRestApi}/*/*/doctors/*

  SlotMaterializerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-slot-materializer
      Runtime: python3.12
      Handler: slot_materializer.handler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${EnvironmentName}-AuthLambdaRoleArn
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref SlotMaterializerLambdaS3Key
      Timeout: 300
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetAId
          - Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /medislot/${EnvironmentName}/database/host
          DB_PORT_PARAMETER: !Sub /medislot/${EnvironmentName}/database/port
          DB_NAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/name
          DB_USERNAME_PARAMETER: !Sub /medislot/${EnvironmentName}/database/username
          DB_SECRET_ARN:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-DatabaseSecretArn
          SLOT_TABLE_NAME:
            Fn::ImportValue:
              Fn::Sub: medislot-${EnvironmentName}-SlotStateTableName

  SlotMaterializerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub medislot-${EnvironmentName}-slot-materializer-daily
      Description: Roll MediSlot's rolling 30-day doctor slot window forward daily
      ScheduleExpression: cron(15 18 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SlotMaterializerFunction.Arn
          Id: SlotMaterializerTarget

  SlotMaterializerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SlotMaterializerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SlotMaterializerSchedule.Arn

  ApiDeploymentMilestone4:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - RegisterMethod
      - LoginMethod
      - RefreshMethod
