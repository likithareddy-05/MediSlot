AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot security stack with three IAM roles and a JWT SecureString
  parameter in AWS Systems Manager Parameter Store.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: MediSlot deployment environment

Resources:

  # ==================================================
  # ROLE 1: Shared Authentication Lambda Execution Role
  # Used by Register, Login, Refresh, Logout, and the
  # temporary JWT parameter creator custom-resource Lambda.
  # ==================================================
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${EnvironmentName}-auth-lambda-role
      Description: Shared execution role for MediSlot authentication Lambdas
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:
        - PolicyName: MediSlotAuthResourceAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              # Read RDS credentials from Secrets Manager.
              - Sid: ReadDatabaseSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue:
                    !Sub medislot-${EnvironmentName}-DatabaseSecretArn

              # Read the JWT signing secret.
              - Sid: ReadJwtSigningSecret
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/jwt-signing-secret

              # Read runtime authentication configuration from SSM.
              - Sid: ReadAuthenticationConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/access-token-ttl-seconds
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/refresh-token-ttl-seconds
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/bcrypt-work-factor

              # Read database connection settings from SSM.
              # The database password remains in Secrets Manager.
              - Sid: ReadDatabaseConnectionConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/database/host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/database/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/database/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/database/username

              # The JWT parameter creator custom resource uses
              # this shared role to create and delete the secret.
              # These permissions are consequently also available
              # to the authentication Lambdas using this role.
              - Sid: ManageJwtSigningParameter
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/jwt-signing-secret

              # Read, create, delete, and atomically rotate
              # refresh-token records.
              - Sid: ManageRefreshTokens
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                    - TableName:
                        Fn::ImportValue:
                          !Sub medislot-${EnvironmentName}-RefreshTokensTableName

              # Find refresh tokens by their SHA-256 hash
              # using the RefreshTokenHashIndex GSI.
              - Sid: QueryRefreshTokensByHash
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/RefreshTokenHashIndex
                    - TableName:
                        Fn::ImportValue:
                          !Sub medislot-${EnvironmentName}-RefreshTokensTableName

              # Logout writes revoked JWT IDs. The authorizer
              # checks the same table before accepting a token.
              - Sid: ManageRevokedTokens
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                    - TableName:
                        Fn::ImportValue:
                          !Sub medislot-${EnvironmentName}-RevokedTokensTableName

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ==================================================
  # ROLE 2: JWT Lambda Authorizer Execution Role
  # ==================================================
  AuthAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${EnvironmentName}-auth-authorizer-role
      Description: Execution role for the MediSlot JWT Lambda Authorizer
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:
        - PolicyName: MediSlotAuthorizerResourceAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              # Read the JWT signing secret to verify signatures.
              - Sid: ReadJwtSigningSecret
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/jwt-signing-secret

              # Check whether the presented JWT has been revoked.
              - Sid: CheckRevokedTokens
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                    - TableName:
                        Fn::ImportValue:
                          !Sub medislot-${EnvironmentName}-RevokedTokensTableName

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ==================================================
  # ROLE 3: API Gateway Invocation Role
  # Allows API Gateway to invoke the configured MediSlot
  # authentication, user, and appointment Lambda functions.
  # ==================================================
  ApiGatewayInvokeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${EnvironmentName}-apigateway-invoke-lambda-role
      Description: Allows API Gateway to invoke MediSlot Lambda integrations
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: MediSlotInvokeLambdaIntegrations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeMediSlotLambdas
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${EnvironmentName}-auth-*
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${EnvironmentName}-user-*
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${EnvironmentName}-appointment-*
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${EnvironmentName}-account-*

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ==================================================
  # JWT SIGNING SECRET CREATOR
  # Creates a SecureString parameter using a generated
  # cryptographically secure random secret.
  #
  # This custom-resource Lambda is intentionally not
  # attached to the VPC so it can send its CloudFormation
  # response to the presigned ResponseURL.
  # ==================================================
  JwtParameterCreatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-jwt-parameter-creator
      Description: Creates the MediSlot JWT signing secret in SSM Parameter Store
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AuthLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import json
          import secrets
          import urllib.request

          ssm = boto3.client("ssm")

          def send_response(event, context, status, data, physical_id):
              body = {
                  "Status": status,
                  "Reason": "See CloudWatch Logs: " + context.log_stream_name,
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": True,
                  "Data": data
              }

              encoded = json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=encoded,
                  headers={
                      "content-type": "",
                      "content-length": str(len(encoded))
                  },
                  method="PUT"
              )

              with urllib.request.urlopen(request, timeout=10) as response:
                  response.read()

          def handler(event, context):
              props = event.get("ResourceProperties", {})
              name = props.get("ParameterName")

              if not name:
                  raise ValueError("ParameterName is required")

              physical_id = event.get(
                  "PhysicalResourceId",
                  "medislot-jwt-secret-" + name.replace("/", "-")
              )

              try:
                  if event["RequestType"] == "Delete":
                      try:
                          ssm.delete_parameter(Name=name)
                      except ssm.exceptions.ParameterNotFound:
                          pass

                      send_response(
                          event, context, "SUCCESS", {}, physical_id
                      )
                      return

                  # Keep an existing secret stable across stack updates.
                  try:
                      ssm.get_parameter(
                          Name=name,
                          WithDecryption=False
                      )
                  except ssm.exceptions.ParameterNotFound:
                      secret = secrets.token_urlsafe(48)
                      ssm.put_parameter(
                          Name=name,
                          Value=secret,
                          Type="SecureString",
                          Description="MediSlot JWT signing secret",
                          Overwrite=False
                      )

                  send_response(
                      event,
                      context,
                      "SUCCESS",
                      {"ParameterName": name},
                      physical_id
                  )

              except Exception as exc:
                  print(
                      "JWT parameter custom resource failed:",
                      str(exc)
                  )
                  try:
                      send_response(
                          event, context, "FAILED", {}, physical_id
                      )
                  except Exception as response_error:
                      print(
                          "Failed to send CloudFormation response:",
                          str(response_error)
                      )
                  raise

  # ==================================================
  # SSM SECURESTRING CUSTOM RESOURCE
  # ==================================================
  JwtSigningSecretParameter:
    Type: Custom::JwtSigningSecret
    DependsOn:
      - JwtParameterCreatorFunction
    Properties:
      ServiceToken: !GetAtt JwtParameterCreatorFunction.Arn
      ParameterName: !Sub /medislot/${EnvironmentName}/auth/jwt-signing-secret

  AccessTokenTtlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/auth/access-token-ttl-seconds
      Type: String
      Value: "900"
      Description: Access JWT lifetime in seconds (15 minutes by default)
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  RefreshTokenTtlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/auth/refresh-token-ttl-seconds
      Type: String
      Value: "604800"
      Description: Refresh token lifetime in seconds (7 days by default)
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  BcryptWorkFactorParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/auth/bcrypt-work-factor
      Type: String
      Value: "12"
      Description: bcrypt password hashing work factor; minimum supported value is 12
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

Outputs:

  AuthLambdaRoleArn:
    Description: Shared authentication Lambda execution role ARN
    Value: !GetAtt AuthLambdaRole.Arn
    Export:
      Name: !Sub medislot-${EnvironmentName}-AuthLambdaRoleArn

  AuthAuthorizerRoleArn:
    Description: JWT authorizer Lambda execution role ARN
    Value: !GetAtt AuthAuthorizerRole.Arn
    Export:
      Name: !Sub medislot-${EnvironmentName}-AuthAuthorizerRoleArn

  ApiGatewayInvokeLambdaRoleArn:
    Description: API Gateway Lambda invocation role ARN
    Value: !GetAtt ApiGatewayInvokeLambdaRole.Arn
    Export:
      Name: !Sub medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn

  JwtSigningSecretParameterName:
    Description: SSM parameter name containing the JWT signing secret
    Value: !Sub /medislot/${EnvironmentName}/auth/jwt-signing-secret
