name: MediSlot Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: medislot-infrastructure-${{ vars.ENVIRONMENT_NAME }}
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    # Deploy only when manually triggered from the feature branch.
    if: github.ref == 'refs/heads/feature'

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in AWS_REGION ENVIRONMENT_NAME AWS_ROLE_TO_ASSUME; do
            if [[ -z "${!name:-}" || "${!name}" == "null" ]]; then
              echo "::error::Missing GitHub Actions configuration: ${name}"
              exit 1
            fi
          done

          case "$ENVIRONMENT_NAME" in
            dev|test|prod) ;;
            *)
              echo "::error::ENVIRONMENT_NAME must be dev, test, or prod."
              exit 1
              ;;
          esac

          for file in \
            infrastructure/network.yaml \
            infrastructure/data.yaml \
            infrastructure/security.yaml \
            infrastructure/authentication.yaml \
            infrastructure/schema-init.yaml \
            src/lambdas/auth_handler.py \
            src/lambdas/register.py \
            src/lambdas/refresh.py \
            src/lambdas/logout.py \
            src/lambdas/authorizer.py \
            src/lambdas/profile.py \
            src/lambdas/schema_init.py \
            src/lambdas/requirements.txt \
            database/schema.sql
          do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --region "$AWS_REGION"

      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network.yaml \
            infrastructure/data.yaml \
            infrastructure/security.yaml \
            infrastructure/authentication.yaml \
            infrastructure/schema-init.yaml
          do
            echo "Validating ${template}"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION" >/dev/null
          done

      - name: Deploy network, data and security stacks
        shell: bash
        run: |
          set -euo pipefail

          deploy_stack() {
            local stack_name="$1"
            local template_file="$2"
            shift 2

            echo "Deploying CloudFormation stack: ${stack_name}"

            aws cloudformation deploy \
              --stack-name "$stack_name" \
              --template-file "$template_file" \
              --parameter-overrides \
                "EnvironmentName=${ENVIRONMENT_NAME}" "$@" \
              --capabilities CAPABILITY_NAMED_IAM \
              --region "$AWS_REGION" \
              --no-fail-on-empty-changeset
          }

          deploy_stack \
            "medislot-${ENVIRONMENT_NAME}-network" \
            infrastructure/network.yaml

          deploy_stack \
            "medislot-${ENVIRONMENT_NAME}-data" \
            infrastructure/data.yaml

          deploy_stack \
            "medislot-${ENVIRONMENT_NAME}-security" \
            infrastructure/security.yaml

      - name: Resolve CloudFormation-created assets bucket
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="medislot-${ENVIRONMENT_NAME}-data"

          ASSETS_BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AssetsBucketName'].OutputValue | [0]" \
            --output text \
            --region "$AWS_REGION")"

          if [[ -z "$ASSETS_BUCKET" || "$ASSETS_BUCKET" == "None" ]]; then
            echo "::error::AssetsBucketName output was not found in ${STACK_NAME}."
            exit 1
          fi

          echo "bucket=${ASSETS_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "CloudFormation assets bucket resolved successfully."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Lambda Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/lambdas

      - name: Package and upload Lambda artifacts
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          mkdir -p build/lambdas

          package_lambda() {
            local package_name="$1"
            shift

            local package_dir="build/${package_name}"
            local zip_file="build/lambdas/${package_name}.zip"
            local s3_key="artifacts/${GITHUB_SHA}/${package_name}.zip"

            rm -rf "$package_dir"
            mkdir -p "$package_dir"

            python -m pip install \
              --only-binary=:all: \
              -r src/lambdas/requirements.txt \
              -t "$package_dir"

            for source_file in "$@"; do
              cp "src/lambdas/${source_file}" "$package_dir/"
            done

            rm -f "$zip_file"

            (
              cd "$package_dir"
              zip -qr "../lambdas/${package_name}.zip" .
            )

            aws s3 cp \
              "$zip_file" \
              "s3://${ARTIFACT_BUCKET}/${s3_key}" \
              --region "$AWS_REGION"

            echo "Uploaded ${s3_key}"
          }

          # Existing authentication Lambda.
          package_lambda auth \
            auth_handler.py \
            register.py \
            refresh.py \
            logout.py

          # Existing JWT authorizer Lambda.
          package_lambda authorizer authorizer.py

          # Existing profile Lambda.
          package_lambda profile profile.py

          # One-time database schema initializer.
          # It needs PyMySQL and the SQL file, not the full app dependencies.
          SCHEMA_DIR="build/schema-init"
          SCHEMA_ZIP="build/lambdas/schema-init.zip"
          SCHEMA_KEY="artifacts/${GITHUB_SHA}/schema-init.zip"

          rm -rf "$SCHEMA_DIR"
          mkdir -p "$SCHEMA_DIR"

          python -m pip install \
            --only-binary=:all: \
            PyMySQL \
            -t "$SCHEMA_DIR"

          cp src/lambdas/schema_init.py "$SCHEMA_DIR/"
          cp database/schema.sql "$SCHEMA_DIR/"

          rm -f "$SCHEMA_ZIP"

          (
            cd "$SCHEMA_DIR"
            zip -qr "../lambdas/schema-init.zip" .
          )

          aws s3 cp \
            "$SCHEMA_ZIP" \
            "s3://${ARTIFACT_BUCKET}/${SCHEMA_KEY}" \
            --region "$AWS_REGION"

          echo "Uploaded ${SCHEMA_KEY}"

      - name: Deploy authentication API stack
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT_NAME}-authentication" \
            --template-file infrastructure/authentication.yaml \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "LambdaArtifactBucket=${ARTIFACT_BUCKET}" \
              "AuthLambdaS3Key=artifacts/${GITHUB_SHA}/auth.zip" \
              "AuthorizerLambdaS3Key=artifacts/${GITHUB_SHA}/authorizer.zip" \
              "ProfileLambdaS3Key=artifacts/${GITHUB_SHA}/profile.zip" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      - name: Deploy temporary schema initializer stack
        env:
          ARTIFACT_BUCKET: ${{ steps.assets.outputs.bucket }}
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT_NAME}-schema-init" \
            --template-file infrastructure/schema-init.yaml \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "LambdaArtifactBucket=${ARTIFACT_BUCKET}" \
              "SchemaInitLambdaS3Key=artifacts/${GITHUB_SHA}/schema-init.zip" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      - name: Show API and schema initializer outputs
        shell: bash
        run: |
          set -euo pipefail

          for stack in \
            "medislot-${ENVIRONMENT_NAME}-authentication" \
            "medislot-${ENVIRONMENT_NAME}-schema-init"
          do
            echo "Outputs for ${stack}"

            aws cloudformation describe-stacks \
              --stack-name "$stack" \
              --query "Stacks[0].Outputs" \
              --output table \
              --region "$AWS_REGION"
          done
