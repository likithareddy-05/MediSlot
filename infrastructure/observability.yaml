            "query": "SOURCE '/medislot/${EnvironmentName}/lambda/booking-domain' | SOURCE '/medislot/${EnvironmentName}/lambda/reschedule-saga' | SOURCE '/medislot/${EnvironmentName}/lambda/waitlist-promotion' | SOURCE '/medislot/${EnvironmentName}/lambda/notification-dispatcher' | fields @timestamp, @log, @message | filter @message like /ERROR|\"level\": \"ERROR\"|failed/ | sort @timestamp desc | limit 50",
