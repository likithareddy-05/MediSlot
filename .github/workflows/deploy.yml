name: MediSlot Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: medislot-infrastructure-dev
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    # Development deployments are permitted only from feature.
    if: github.ref == 'refs/heads/feature'

    env:
      AWS_REGION: eu-north-1
      ENVIRONMENT_NAME: dev
      # Accepts a repository Variable (preferred) or a Secret with the same name.
      ARTIFACT_BUCKET: ${{ vars.MEDISLOT_ARTIFACT_BUCKET || secrets.MEDISLOT_ARTIFACT_BUCKET }}

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. CHECK CONFIGURATION BEFORE ANY AWS CHANGES
      # --------------------------------------------------
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ARTIFACT_BUCKET:-}" ||
                "$ARTIFACT_BUCKET" == "null" ]]; then
            echo "::error::MEDISLOT_ARTIFACT_BUCKET is missing (checked both repository Variables and Secrets)."
            echo "Create it exactly as MEDISLOT_ARTIFACT_BUCKET in Settings > Secrets and variables > Actions (Variables tab preferred)."
            exit 1
          fi

          if [[ ! "$ARTIFACT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::MEDISLOT_ARTIFACT_BUCKET does not look like a valid S3 bucket name."
            exit 1
          fi

          for file in \
            infrastructure/network.yaml \
            infrastructure/data.yaml \
            infrastructure/security.yaml \
            infrastructure/authentication.yaml \
            src/lambdas/register.py \
            src/lambdas/auth.py \
            src/lambdas/refresh.py \
            src/lambdas/logout.py \
            src/lambdas/authorizer.py \
            src/lambdas/requirements.txt
          do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          echo "Deployment configuration and required files are present."

      # --------------------------------------------------
      # 3. CONFIGURE AWS THROUGH GITHUB OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::201261380083:role/MediSlotGitHubActionsRole
          aws-region: eu-north-1

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --region "$AWS_REGION"

      # --------------------------------------------------
      # 4. VALIDATE ALL CLOUDFORMATION TEMPLATES
      # --------------------------------------------------
      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network.yaml \
            infrastructure/data.yaml \
            infrastructure/security.yaml \
            infrastructure/authentication.yaml
          do
            echo "Validating $template"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION" \
              >/dev/null

            echo "$template passed CloudFormation template validation."
          done

      # --------------------------------------------------
      # 5. PACKAGE AND UPLOAD LAMBDAS BEFORE STACK CHANGES
      # This catches package/dependency/bucket permission errors
      # before modifying any CloudFormation stacks.
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package and upload authentication Lambdas
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip install --upgrade pip

          mkdir -p build/lambdas

          package_lambda() {
            local source_file="$1"
            local package_name="$2"
            local package_dir="build/${package_name}"
            local zip_file="build/lambdas/${package_name}.zip"
            local s3_key="artifacts/${GITHUB_SHA}/${package_name}.zip"

            echo "Packaging ${source_file}"

            rm -rf "$package_dir"
            mkdir -p "$package_dir"

            python -m pip install \
              --only-binary=:all: \
              -r src/lambdas/requirements.txt \
              -t "$package_dir"

            cp "src/lambdas/${source_file}" "$package_dir/"

            rm -f "$zip_file"

            (
              cd "$package_dir"
              zip -qr "../lambdas/${package_name}.zip" .
            )

            echo "Uploading ${package_name}.zip"

            aws s3 cp \
              "$zip_file" \
              "s3://${ARTIFACT_BUCKET}/${s3_key}" \
              --region "$AWS_REGION"

            echo "Uploaded ${s3_key}"
          }

          package_lambda register.py register
          package_lambda auth.py login
          package_lambda refresh.py refresh
          package_lambda logout.py logout
          package_lambda authorizer.py authorizer

          echo "All authentication Lambda packages uploaded."

      # --------------------------------------------------
      # 6. REUSABLE CLOUDFORMATION CHANGE SET DEPLOYMENT
      # Handles create, update, and no-change outcomes.
      # --------------------------------------------------
      - name: Deploy infrastructure stacks
        shell: bash
        run: |
          set -euo pipefail

          deploy_stack() {
            local stack_name="$1"
            local template_file="$2"
            local change_set_name
            local change_set_type
            local status
            local reason
            local waiter_failed=0

            shift 2

            # Parse optional parameters/capabilities so --parameters is
            # supplied exactly once to CloudFormation.
            local -a parameters=("ParameterKey=EnvironmentName,ParameterValue=${ENVIRONMENT_NAME}")
            local -a capabilities=()
            local has_custom_parameters=0

            while (($#)); do
              case "$1" in
                --parameters)
                  if [[ "$has_custom_parameters" -eq 0 ]]; then
                    parameters=()
                    has_custom_parameters=1
                  fi
                  shift

                  while (($#)) && [[ "$1" != --* ]]; do
                    parameters+=("$1")
                    shift
                  done
                  ;;
                --capabilities)
                  shift

                  while (($#)) && [[ "$1" != --* ]]; do
                    capabilities+=("$1")
                    shift
                  done
                  ;;
                *)
                  echo "::error::Unsupported deploy_stack argument: $1"
                  return 2
                  ;;
              esac
            done

            if [[ "$has_custom_parameters" -eq 1 ]]; then
              local env_parameter_count=0
              local parameter

              for parameter in "${parameters[@]}"; do
                [[ "$parameter" == ParameterKey=EnvironmentName,* ]] && ((env_parameter_count+=1))
              done

              if [[ "$env_parameter_count" -ne 1 ]]; then
                echo "::error::${stack_name} must receive exactly one EnvironmentName parameter."
                return 2
              fi
            fi

            change_set_name="${stack_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            echo "--------------------------------------------------"
            echo "Preparing ${stack_name}"
            echo "Template: ${template_file}"
            echo "--------------------------------------------------"

            local describe_error

            if describe_error=$(aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --region "$AWS_REGION" 2>&1); then
              change_set_type="UPDATE"
            elif [[ "$describe_error" == *"does not exist" ||
                    "$describe_error" == *"not exist" ]]; then
              change_set_type="CREATE"
            else
              echo "::error::Could not determine whether ${stack_name} exists: ${describe_error}"
              return 1
            fi

            echo "Change set type: ${change_set_type}"

            aws cloudformation create-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --change-set-type "$change_set_type" \
              --template-body "file://${template_file}" \
              --parameters "${parameters[@]}" \
              "${capabilities[@]}" \
              --region "$AWS_REGION"

            if ! aws cloudformation wait change-set-create-complete \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION"; then
              waiter_failed=1
            fi

            status=$(aws cloudformation describe-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text)

            reason=$(aws cloudformation describe-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION" \
              --query 'StatusReason' \
              --output text)

            if [[ "$status" == "FAILED" ]]; then
              if [[ "$reason" == *"didn't contain changes"* ||
                    "$reason" == *"No updates are to be performed"* ]]; then
                echo "No changes required for ${stack_name}."

                aws cloudformation delete-change-set \
                  --stack-name "$stack_name" \
                  --change-set-name "$change_set_name" \
                  --region "$AWS_REGION" || true

                return 0
              fi

              echo "::error::Change set failed for ${stack_name}: ${reason}"
              return 1
            fi

            if [[ "$waiter_failed" -ne 0 ||
                  "$status" != "CREATE_COMPLETE" ]]; then
              echo "::error::Unexpected change set status for ${stack_name}: ${status}"
              echo "Reason: ${reason}"
              return 1
            fi

            echo "Planned changes for ${stack_name}:"

            aws cloudformation describe-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION" \
              --query 'Changes[*].ResourceChange.{Action:Action,Type:ResourceType,LogicalId:LogicalResourceId,Replacement:Replacement}' \
              --output table

            echo "Executing change set for ${stack_name}"

            aws cloudformation execute-change-set \
              --stack-name "$stack_name" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION"

            if [[ "$change_set_type" == "CREATE" ]]; then
              aws cloudformation wait stack-create-complete \
                --stack-name "$stack_name" \
                --region "$AWS_REGION"
            else
              aws cloudformation wait stack-update-complete \
                --stack-name "$stack_name" \
                --region "$AWS_REGION"
            fi

            local final_status

            final_status=$(aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text)

            if [[ "$final_status" != "CREATE_COMPLETE" &&
                  "$final_status" != "UPDATE_COMPLETE" ]]; then
              echo "::error::Unexpected final status for ${stack_name}: ${final_status}"
              return 1
            fi

            echo "${stack_name} completed with status ${final_status}."
          }

          # --------------------------------------------------
          # STACK 1: NETWORK
          # --------------------------------------------------
          deploy_stack \
            "medislot-${ENVIRONMENT_NAME}-network" \
            "infrastructure/network.yaml"

          # Verify exports required by the data stack.
          for export_name in \
            "medislot-${ENVIRONMENT_NAME}-PrivateSubnetAId" \
            "medislot-${ENVIRONMENT_NAME}-PrivateSubnetBId" \
            "medislot-${ENVIRONMENT_NAME}-RDSSecurityGroupId"
          do
            found=$(aws cloudformation list-exports \
              --region "$AWS_REGION" \
              --query "Exports[?Name=='${export_name}'].Name | [0]" \
              --output text)

            if [[ "$found" != "$export_name" ]]; then
              echo "::error::Required network export is missing: ${export_name}"
              exit 1
            fi
          done

          echo "Required network exports are available."

          # --------------------------------------------------
          # STACK 2: DATA
          # --------------------------------------------------
          deploy_stack \
            "medislot-${ENVIRONMENT_NAME}-data" \
            "infrastructure/data.yaml"

          # --------------------------------------------------
          # STACK 3: SECURITY
          # Contains named IAM roles, so CAPABILITY_NAMED_IAM
          # is required.
          # --------------------------------------------------
          deploy_stack \
            "medislot-${ENVIRONMENT_NAME}-security" \
            "infrastructure/security.yaml" \
            --capabilities CAPABILITY_NAMED_IAM

          # --------------------------------------------------
          # STACK 4: AUTHENTICATION
          # Lambda artifacts were uploaded before stack changes.
          # --------------------------------------------------
          deploy_stack \
            "medislot-${ENVIRONMENT_NAME}-authentication" \
            "infrastructure/authentication.yaml" \
            --capabilities CAPABILITY_IAM \
            --parameters \
              "ParameterKey=EnvironmentName,ParameterValue=${ENVIRONMENT_NAME}" \
              "ParameterKey=LambdaArtifactBucket,ParameterValue=${ARTIFACT_BUCKET}" \
              "ParameterKey=RegisterLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/register.zip" \
              "ParameterKey=LoginLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/login.zip" \
              "ParameterKey=RefreshLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/refresh.zip" \
              "ParameterKey=LogoutLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/logout.zip" \
              "ParameterKey=AuthorizerLambdaS3Key,ParameterValue=artifacts/${GITHUB_SHA}/authorizer.zip"

      # --------------------------------------------------
      # 7. SHOW STACK OUTPUTS
      # --------------------------------------------------
      - name: Show deployed stack outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          for stack in network data security authentication; do
            stack_name="medislot-${ENVIRONMENT_NAME}-${stack}"

            echo "--------------------------------------------------"
            echo "Stack: ${stack_name}"
            echo "--------------------------------------------------"

            aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
              --output json