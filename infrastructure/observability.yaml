  # ---- Category 1: API health (the 5XX alarm lives in the authentication stack)
  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-api-latency-p99
      AlarmDescription: "API p99 latency above 3 seconds for 10 minutes."
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub medislot-${EnvironmentName}-api
        - Name: Stage
          Value: !Ref EnvironmentName
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---- Category 2: Lambda errors (API Lambdas have one alarm each in the authentication stack)
  WorkflowLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-lambda-errors-workflows
      AlarmDescription: "A saga, waitlist, notification or scheduled-job Lambda returned an error. Check /medislot/<env>/lambda/*."
      Metrics:
        - Id: e0
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub medislot-${EnvironmentName}-reschedule-saga
            Period: 300
            Stat: Sum
        - Id: e1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub medislot-${EnvironmentName}-notification-dispatcher
            Period: 300
            Stat: Sum
        - Id: e2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub medislot-${EnvironmentName}-reminder-dispatcher
            Period: 300
            Stat: Sum
        - Id: e3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub medislot-${EnvironmentName}-waitlist-promotion
            Period: 300
            Stat: Sum
        - Id: e4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub medislot-${EnvironmentName}-offer-expiry-sweeper
            Period: 300
            Stat: Sum
        - Id: e5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub medislot-${EnvironmentName}-no-show-sweeper
            Period: 300
            Stat: Sum
        - Id: total
          Expression: SUM(METRICS())
          Label: Workflow Lambda errors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---- Category 3: dead-letter queues (a notification or promotion failed 5 times)
  NotificationDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-dlq-notifications
      AlarmDescription: "Messages in the notification dead-letter queue: some notifications were not delivered."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub medislot-${EnvironmentName}-notifications-dlq
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  WaitlistDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-dlq-waitlist
      AlarmDescription: "Messages in the waitlist dead-letter queue: a freed seat was not offered (the expiry sweeper re-checks held seats every minute)."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub medislot-${EnvironmentName}-waitlist-seat-freed-dlq
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---- Category 4: reschedule saga
  RescheduleCompensatedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-reschedule-compensated
      AlarmDescription: "A reschedule failed midway and was compensated (the patient kept the original appointment). Review the execution history."
      Namespace: MediSlot
      MetricName: ReschedulesCompensated
      Dimensions:
        - Name: Environment
          Value: !Ref EnvironmentName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  SagaTimedOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-saga-executions-failed-unexpectedly
      AlarmDescription: "A reschedule saga execution timed out or was aborted."
      Namespace: AWS/States
      MetricName: ExecutionsTimedOut
      Dimensions:
        - Name: StateMachineArn
          Value: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:medislot-${EnvironmentName}-reschedule-saga
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---- Category 5: scheduled jobs not running (missing data = not running = alarm)
  OfferSweeperNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-offer-sweeper-not-running
      AlarmDescription: "The hold-offer expiry sweeper (every minute) has not run for 5 minutes."
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Sub medislot-${EnvironmentName}-offer-expiry-sweeper
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  ReminderNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-reminders-not-running
      AlarmDescription: "The reminder dispatcher (every 5 minutes) has not run for 15 minutes."
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Sub medislot-${EnvironmentName}-reminder-dispatcher
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  NoShowNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-no-show-sweeper-not-running
      AlarmDescription: "The no-show sweeper (every 15 minutes) has not run for 45 minutes."
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Sub medislot-${EnvironmentName}-no-show-sweeper
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---- Category 6: data layer and event delivery
  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-rds-cpu-high
      AlarmDescription: "RDS CPU above 80% for 15 minutes."
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub medislot-${EnvironmentName}-mysql
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  RdsStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-rds-storage-low
      AlarmDescription: "RDS free storage below 2 GiB."
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub medislot-${EnvironmentName}-mysql
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  DynamoThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-dynamodb-throttles
      AlarmDescription: "Requests to the appointments table were throttled."
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Sub medislot-${EnvironmentName}-appointments
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  EventPublishFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${EnvironmentName}-event-publish-failures
      AlarmDescription: "Domain events could not be put on EventBridge (notifications or waitlist promotions may be missing)."
      Namespace: MediSlot
      MetricName: EventPublishFailures
      Dimensions:
        - Name: Environment
          Value: !Ref EnvironmentName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      OKActions:
        - Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---- Cost: monthly budget on the Project cost allocation tag
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub medislot-${EnvironmentName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostFilters:
          TagKeyValue:
            - user:Project$MediSlot
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address:
                Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address:
                Fn::ImportValue: !Sub medislot-${EnvironmentName}-OperationsAlarmTopicArn

Outputs:
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}
