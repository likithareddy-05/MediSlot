AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot security stack. Creates least-privilege execution roles for the
  consolidated Auth Lambda, JWT Authorizer, API Gateway, and JWT secret
  custom-resource Lambda. Creates JWT runtime configuration in SSM.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
    Description: Explicit MediSlot deployment environment. Supply this value during deployment.

Resources:
  # --------------------------------------------------
  # Auth Lambda execution role
  # Used by the consolidated Auth Lambda for register,
  # login, refresh and logout.
  # --------------------------------------------------
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${EnvironmentName}-auth-lambda-role
      Description: Execution role for the MediSlot consolidated Auth Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: MediSlotAuthRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDatabaseSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue:
                    !Sub medislot-${EnvironmentName}-DatabaseSecretArn

              - Sid: ReadJwtSigningSecret
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/jwt-signing-secret

              - Sid: ReadAuthenticationConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/access-token-ttl-seconds
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/refresh-token-ttl-seconds
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/bcrypt-work-factor

              - Sid: ReadDatabaseConnectionConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/database/host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/database/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/database/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/database/username

              # Refresh tokens are tracked in DynamoDB. Access JWTs are
              # stateless and are not written to a denylist or allowlist.
              - Sid: ManageRefreshTokenRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                    - TableName:
                        Fn::ImportValue:
                          !Sub medislot-${EnvironmentName}-RefreshTokensTableName
                  - !Sub
                    - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/RefreshTokenHashIndex
                    - TableName:
                        Fn::ImportValue:
                          !Sub medislot-${EnvironmentName}-RefreshTokensTableName
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # --------------------------------------------------
  # JWT Authorizer execution role
  # Validates JWTs statelessly. It does not read a
  # revoked-token table or active-access-token table.
  # --------------------------------------------------
  AuthAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${EnvironmentName}-auth-authorizer-role
      Description: Execution role for the MediSlot JWT Lambda Authorizer
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: MediSlotAuthorizerRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadJwtSigningSecret
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/jwt-signing-secret
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # --------------------------------------------------
  # API Gateway invocation role
  # Restrict invocation to the actual Lambda functions
  # declared by the consolidated authentication template.
  # --------------------------------------------------
  ApiGatewayInvokeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${EnvironmentName}-apigateway-invoke-lambda-role
      Description: Allows API Gateway to invoke MediSlot API Lambda integrations and authorizer
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: MediSlotInvokeSpecificLambdas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeAuthLambda
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${EnvironmentName}-auth
              - Sid: InvokeAuthorizerLambda
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${EnvironmentName}-auth-authorizer
              - Sid: InvokeAccountProfileLambda
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${EnvironmentName}-account-profile
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # --------------------------------------------------
  # Dedicated role for the CloudFormation custom
  # resource that creates the JWT signing SecureString.
  # This role is NOT shared with runtime Auth Lambda.
  # The function stays outside the VPC to send the
  # CloudFormation response to its presigned ResponseURL.
  # --------------------------------------------------
  JwtParameterCreatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${EnvironmentName}-jwt-parameter-creator-role
      Description: Least-privilege role for creating the JWT signing parameter
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ManageOnlyJwtSigningParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCreateAndDeleteJwtSigningParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${EnvironmentName}/auth/jwt-signing-secret
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  JwtParameterCreatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub medislot-${EnvironmentName}-jwt-parameter-creator
      Description: Creates the MediSlot JWT signing secret in SSM Parameter Store
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt JwtParameterCreatorRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import json
          import secrets
          import urllib.request

          ssm = boto3.client("ssm")

          def send_response(event, context, status, data, physical_id):
              body = {
                  "Status": status,
                  "Reason": "See CloudWatch Logs: " + context.log_stream_name,
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": True,
                  "Data": data
              }
              encoded = json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=encoded,
                  headers={
                      "content-type": "",
                      "content-length": str(len(encoded))
                  },
                  method="PUT"
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  response.read()

          def handler(event, context):
              props = event.get("ResourceProperties", {})
              name = props.get("ParameterName")
              if not name:
                  raise ValueError("ParameterName is required")

              physical_id = event.get(
                  "PhysicalResourceId",
                  "medislot-jwt-secret-" + name.replace("/", "-")
              )

              try:
                  request_type = event["RequestType"]

                  # Keep the secret stable across stack updates. On deletion,
                  # remove the parameter owned by this custom resource.
                  if request_type == "Delete":
                      try:
                          ssm.delete_parameter(Name=name)
                      except ssm.exceptions.ParameterNotFound:
                          pass
                      send_response(event, context, "SUCCESS", {}, physical_id)
                      return

                  try:
                      ssm.get_parameter(Name=name, WithDecryption=False)
                  except ssm.exceptions.ParameterNotFound:
                      secret = secrets.token_urlsafe(48)
                      ssm.put_parameter(
                          Name=name,
                          Value=secret,
                          Type="SecureString",
                          Description="MediSlot JWT signing secret",
                          Overwrite=False
                      )

                  send_response(
                      event,
                      context,
                      "SUCCESS",
                      {"ParameterName": name},
                      physical_id
                  )
              except Exception as exc:
                  print("JWT parameter custom resource failed:", str(exc))
                  try:
                      send_response(event, context, "FAILED", {}, physical_id)
                  except Exception as response_error:
                      print("Failed to send CloudFormation response:", str(response_error))
                  raise

  JwtSigningSecretParameter:
    Type: Custom::JwtSigningSecret
    DependsOn:
      - JwtParameterCreatorFunction
    Properties:
      ServiceToken: !GetAtt JwtParameterCreatorFunction.Arn
      ParameterName: !Sub /medislot/${EnvironmentName}/auth/jwt-signing-secret

  AccessTokenTtlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/auth/access-token-ttl-seconds
      Type: String
      Value: "900"
      Description: Access JWT lifetime in seconds (15 minutes)
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  RefreshTokenTtlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/auth/refresh-token-ttl-seconds
      Type: String
      Value: "604800"
      Description: Refresh token lifetime in seconds (7 days, fixed from login)
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

  BcryptWorkFactorParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${EnvironmentName}/auth/bcrypt-work-factor
      Type: String
      Value: "12"
      Description: bcrypt password hashing work factor
      Tags:
        Project: MediSlot
        Environment: !Ref EnvironmentName

Outputs:
  AuthLambdaRoleArn:
    Description: Execution role ARN for the consolidated Auth Lambda
    Value: !GetAtt AuthLambdaRole.Arn
    Export:
      Name: !Sub medislot-${EnvironmentName}-AuthLambdaRoleArn

  AuthAuthorizerRoleArn:
    Description: Execution role ARN for the JWT Authorizer Lambda
    Value: !GetAtt AuthAuthorizerRole.Arn
    Export:
      Name: !Sub medislot-${EnvironmentName}-AuthAuthorizerRoleArn

  ApiGatewayInvokeLambdaRoleArn:
    Description: API Gateway invocation role ARN
    Value: !GetAtt ApiGatewayInvokeLambdaRole.Arn
    Export:
      Name: !Sub medislot-${EnvironmentName}-ApiGatewayInvokeLambdaRoleArn

  JwtSigningSecretParameterName:
    Description: SSM parameter name containing the JWT signing secret
    Value: !Sub /medislot/${EnvironmentName}/auth/jwt-signing-secret
